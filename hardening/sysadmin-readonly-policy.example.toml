# Install as /etc/sysadmin-readonly-policy.toml, owned by root:root, mode 0644.
# Keep this list aligned with the application host's allowed_logs setting.

[policy]
allowed_logs = ["/var/log/auth.log", "/var/log/syslog"]
restart_services = []

# The client sends only the ID; this root-owned policy selects the executable.
[policy.backup_jobs]
database-dump = "/root/database-dump.sh"
