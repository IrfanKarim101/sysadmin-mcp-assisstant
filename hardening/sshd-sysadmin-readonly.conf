# Install as /etc/ssh/sshd_config.d/60-sysadmin-readonly.conf.
# Validate with `sshd -t` before reloading sshd. Keep an existing root session
# open until a second connection proves the configuration works.

Match User sysadmin-readonly
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    X11Forwarding no
    AllowTcpForwarding no
    PermitTunnel no
    PermitUserEnvironment no
    ForceCommand /usr/local/bin/sysadmin-readonly-command
