[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sysadmin-mcp-assistant"
version = "0.1.0"
description = "Read-only SSH diagnostics exposed as MCP tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0.0", "asyncssh>=2.14.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sysadmin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
